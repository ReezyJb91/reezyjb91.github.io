<script>
  // Diagnostic error surface — if anything fails (Babel parse error, a runtime error in
  // the app, a failed CDN load), show it as visible text instead of a silent blank page.
  (function () {
    const diag = document.getElementById("diag");
    function showError(msg) {
      diag.style.display = "block";
      diag.textContent += msg + "\n\n";
    }
    window.addEventListener("error", function (e) {
      showError("[error] " + (e.message || e) + (e.filename ? "\n  at " + e.filename + ":" + e.lineno + ":" + e.colno : ""));
    });
    window.addEventListener("unhandledrejection", function (e) {
      showError("[unhandled promise rejection] " + (e.reason && e.reason.message ? e.reason.message : e.reason));
    });
    // If nothing has rendered into #root after 6 seconds, say so explicitly rather than
    // leaving a blank screen with no clue anything went wrong.
    setTimeout(function () {
      const root = document.getElementById("root");
      if (root && root.children.length === 0 && diag.style.display === "none") {
        showError("[diagnostic] Nothing rendered into #root after 6s, and no JS error was caught either. Likely a CDN script (React/Babel/Tailwind) failed to load — check your connection or try reloading.");
      }
    }, 6000);
  })();
</script>

<script>
  // window.storage polyfill — the original app was built against Claude's artifact
  // persistence API, which doesn't exist in a normal browser. This mirrors the same
  // async, Promise-based shape using localStorage, so the app code needed zero changes.
  (function () {
    const PREFIX = "system-engine:";
    window.storage = {
      get: async (key) => {
        const raw = localStorage.getItem(PREFIX + key);
        if (raw === null) return null;
        return { key, value: raw };
      },
      set: async (key, value) => {
        localStorage.setItem(PREFIX + key, value);
        return { key, value };
      },
      delete: async (key) => {
        localStorage.removeItem(PREFIX + key);
        return { key, deleted: true };
      },
      list: async (prefix) => {
        const keys = Object.keys(localStorage)
          .filter((k) => k.startsWith(PREFIX + (prefix || "")))
          .map((k) => k.slice(PREFIX.length));
        return { keys, prefix };
      },
    };
  })();
</script>

// Shared countdown formatter — hour-scale durations (Daily/Urgent Quest windows) show as
// "Xh Ym"; anything under an hour (Penalty challenge minimums) shows as MM:SS.
function formatCountdown(totalSeconds) {
  const clamped = Math.max(0, totalSeconds);
  if (clamped >= 3600) {
    const h = Math.floor(clamped / 3600);
    const m = Math.floor((clamped % 3600) / 60);
    return `${h}h ${m}m`;
  }
  const m = Math.floor(clamped / 60);
  const s = clamped % 60;
  return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
}

// Returns the timestamp (ms) of the next local midnight strictly after `fromMs`.
function getNextMidnight(fromMs) {
  const d = new Date(fromMs);
  d.setHours(24, 0, 0, 0); // JS correctly rolls this into tomorrow's midnight
  return d.getTime();
}

// Persistent typewriter: pulls one line at a time off an ever-growing queue, so multiple
// pushLog calls in the same tick queue up instead of clobbering each other.
function useTypedLog() {
  const [history, setHistory] = useState([]);
  const queueRef = useRef([]);
  const timerRef = useRef(null);

  const push = useCallback((lines) => {
    queueRef.current = [...queueRef.current, ...lines];
    if (!timerRef.current) tick();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  function tick() {
    timerRef.current = setTimeout(() => {
      if (queueRef.current.length === 0) {
        timerRef.current = null;
        return;
      }
      const [next, ...rest] = queueRef.current;
      queueRef.current = rest;
      setHistory((h) => [...h, next]);
      tick();
    }, 550);
  }

  useEffect(() => () => timerRef.current && clearTimeout(timerRef.current), []);

  const clear = useCallback(() => {
    queueRef.current = [];
    if (timerRef.current) {
      clearTimeout(timerRef.current);
      timerRef.current = null;
    }
    setHistory([]);
  }, []);

  return { history, push, clear };
}

  const [domainPointsMissedStreak, setDomainPointsMissedStreak] = useState(

  const { history: logHistory, push: pushLog, clear: clearLog } = useTypedLog();

  // Checks every ACHIEVEMENTS entry against current progress whenever a relevant counter
  // changes, and climbs the tier ladder as far as thresholds allow. unlockedEmblems stores
  // the highest tier INDEX reached per achievement (-1/absent = none yet). If a big jump in
  // one update crosses several tiers at once, each crossed tier gets its own log line.
  useEffect(() => {
    const statTotal = DOMAINS.reduce((sum, d) => sum + (domainStats[d.key] || 0), 0);
    const maxDomainQuestCount = Math.max(0, ...DOMAINS.map((d) => domainQuestCount[d.key] || 0));
    const maxDomainStat = Math.max(0, ...DOMAINS.map((d) => domainStats[d.key] || 0));

    const metricValue = (metric) => {
      switch (metric) {
        case "domainQuestCount":
          return maxDomainQuestCount;
        case "domainStat":
          return maxDomainStat;
        case "statTotal":
          return statTotal;
        case "level":
          return level;
        case "goldEarned":
          return goldEarnedTotal;
        case "goldSpent":
          return goldSpentTotal;
        case "highTierDrops":
          return highTierDropCount;
        default:
          return 0;
      }
    };

    ACHIEVEMENTS.forEach((a) => {
      const currentTier = unlockedEmblems[a.id] ?? -1;
      const value = metricValue(a.metric);
      let newTier = currentTier;
      a.thresholds.forEach((threshold, i) => {
        if (value >= threshold) newTier = i;
      });
      if (newTier > currentTier) {
        for (let i = currentTier + 1; i <= newTier; i++) {
          pushLog([`[System]: Emblem tier unlocked — ${a.label} [${TIERS[i].label}].`]);
        }
        setUnlockedEmblems((prev) => ({ ...prev, [a.id]: newTier }));
      }
    });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [
    domainStats,
    domainQuestCount,
    level,
    goldEarnedTotal,
    goldSpentTotal,
    highTierDropCount,
  ]);


  // Shared XP grant + level-up handling, used by every quest type. Consumes an active
  // XP Booster if one is set — doubles this single grant, then the boost is spent.
  // Ranks domains by hidden value (HV) and distributes up to 3 stat points on level-up:
  // 3+ eligible domains (HV > 0) -> top 3 get 1 each. 2 eligible -> 2/1. 1 eligible -> all 3.
  // Tie-break is randomized each call so ties don't always favor the same domain order.
  function allocateStatPoints(hvMap) {
    const eligible = DOMAINS.filter((d) => (hvMap[d.key] || 0) > 0);
    const ranked = [...eligible]
      .sort(() => Math.random() - 0.5)
      .sort((a, b) => (hvMap[b.key] || 0) - (hvMap[a.key] || 0));

    const allocation = {};
    if (ranked.length >= 3) {
      ranked.slice(0, 3).forEach((d) => (allocation[d.key] = 1));
    } else if (ranked.length === 2) {
      allocation[ranked[0].key] = 2;
      allocation[ranked[1].key] = 1;
    } else if (ranked.length === 1) {
      allocation[ranked[0].key] = 3;
    }
    return allocation;
  }

  // Applies ranked stat allocation for every level gained in one jump (usually 1, but a big
  // XP Booster-doubled grant could cross more than one), accumulates the total gain per
  // domain across however many levels were crossed, applies it once, and queues the popup.
  // Applies ranked stat allocation for every level gained in one jump (usually 1, but a big
  // XP Booster-doubled grant could cross more than one). HV resets to zero after each level
  // processed — including mid-batch for a multi-level jump — so an early lead in HV can't
  // keep winning every future ranking forever; each level-up starts the ranking fresh.
  function processLevelUp(fromLevel, toLevel) {
    const beforeStats = { ...domainStats };
    const totalGain = {};
    let hvSnapshot = { ...domainHV };
    for (let i = 0; i < toLevel - fromLevel; i++) {
      const allocation = allocateStatPoints(hvSnapshot);
      Object.keys(allocation).forEach((key) => {
        totalGain[key] = (totalGain[key] || 0) + allocation[key];
      });
      hvSnapshot = Object.fromEntries(DOMAINS.map((d) => [d.key, 0]));
    }
    setDomainStats((prev) => {
      const next = { ...prev };
      Object.keys(totalGain).forEach((key) => {
        next[key] = (next[key] || 0) + totalGain[key];
      });
      return next;
    });
    setDomainHV(Object.fromEntries(DOMAINS.map((d) => [d.key, 0])));

    const gains = {};
    DOMAINS.forEach((d) => {
      if (totalGain[d.key]) {
        const before = beforeStats[d.key] || 0;
        gains[d.key] = { before, after: before + totalGain[d.key] };
      }
    });
    setLevelUpNotification({ fromLevel, toLevel, gains });
    const gainLines = DOMAINS.filter((d) => gains[d.key])
      .map((d) => `${d.label} ${gains[d.key].before} -> ${gains[d.key].after}`)
      .join(", ");
    pushLog([
      `[System]: Level ${fromLevel} -> ${toLevel}.`,
      gainLines ? `[System]: ${gainLines}` : "[System]: No eligible domain for stat gain.",
    ]);

    // Neglect checkpoint: a domain that received a stat point at any point since the last
    // level-up resets to 0; everything else advances by one checkpoint. Stagnation
    // (Main Quest imbalance) needs no checkpoint step — it's read live from current state.
    // Neglect checkpoint: a domain that received a stat point resets to 0; everything else
    // advances by one checkpoint. "Received a point" means EITHER a manual spend/Urgent
    // Quest resolve flagged before this level-up (domainReceivedPointSinceCycle) OR the
    // ranked HV allocation that just ran above in this same level-up (totalGain) — a domain
    // that just won the allocation clearly isn't neglected, even though nothing had flagged
    // it yet. Missing this second source was the bug: a domain could visibly grow every
    // level-up via the ranked split and still show climbing neglect, because only the other
    // two point sources were ever checked.
    const nextPointsMissed = { ...domainPointsMissedStreak };
    DOMAINS.forEach((d) => {
      const receivedPoint = domainReceivedPointSinceCycle[d.key] || !!totalGain[d.key];
      nextPointsMissed[d.key] = receivedPoint ? 0 : (nextPointsMissed[d.key] || 0) + 1;
    });
    setDomainPointsMissedStreak(nextPointsMissed);
    setDomainReceivedPointSinceCycle(Object.fromEntries(DOMAINS.map((d) => [d.key, false])));

    // Urgent Quest evaluation runs against the neglect numbers just computed above (not
    // possibly-stale committed state) and live Main Quest counts for stagnation. Function
    // declarations are hoisted, so this can reference evaluateUrgentTriggers even though
    // it's defined later in the file.
    evaluateUrgentTriggers(nextPointsMissed, domainMainQuestsSinceReset);
  }

  function grantXp(amount) {
    const doubled = xpBoostActive;
    const finalAmount = doubled ? amount * 2 : amount;
    if (doubled) {
      setXpBoostActive(false);
      pushLog([`[System]: XP Booster consumed — doubled to +${finalAmount}.`]);
    }
    setXp((prevXp) => {
      let total = prevXp + finalAmount;
      let lvl = level;
      let cap = lvl * 100;
      while (total >= cap) {
        total -= cap;
        lvl += 1;
        cap = lvl * 100;
      }
      if (lvl !== level) {
        setLevel(lvl);
        // processLevelUp must NOT run here — this callback executes synchronously inside
        // whatever handler called grantXp, before that handler's OTHER setState calls
        // (e.g., flagging a domain as touched/received-a-point) have actually committed.
        // Queuing it for a useEffect guarantees it only runs after everything from this
        // action has landed, so it reads fresh state instead of stale pre-action closures.
        setPendingLevelUps((prev) => [...prev, { fromLevel: level, toLevel: lvl }]);
      }
      return total;
    });
  }

  // Every HV grant also counts toward leveling — 1 HV = 1 XP, applied through the same
  // grantXp path (including XP Booster doubling). This is the single place HV is ever
  // added, so every source (daily tasks, quests, HV Catalyst) stays consistent.
  function grantHV(domainKey, amount) {
    setDomainHV((prev) => ({ ...prev, [domainKey]: (prev[domainKey] || 0) + amount }));
    grantXp(amount);
  }

  function activateXpBoost() {
    if (inventory.xpBoosters <= 0 || xpBoostActive) return;
    setInventory((prev) => ({ ...prev, xpBoosters: prev.xpBoosters - 1 }));
    setXpBoostActive(true);
    pushLog(["[System]: XP Booster activated — next XP grant doubled."]);

  function spendHvCatalyst() {

    const domain = DOMAINS.find((d) => d.key === spendCatalystDomain);
    setInventory((prev) => ({ ...prev, hvCatalysts: prev.hvCatalysts - 1 }));

  // Avatar creation is one-and-done — this is the only way to change hairstyle afterward.
  // Consumes on use, temporarily re-enables just the hairstyle picker; re-locks automatically

  function useHairstyleChange() {

  // Shop: purely cosmetic. Head/Upper/Lower are buy-once-equip-freely; Accessory/Aura are
  // sequential ladders (must own tier N-1 before buying tier N). Every purchase here is the
  // only source of goldSpentTotal, which is what the "Big Spender" emblem tracks.
  function buyCosmeticItem(slot, catalog, item) {
    const owned = shopOwned[slot];
    if (owned.includes(item.id) || inventory.gold < item.cost) return;
    setInventory((prev) => ({ ...prev, gold: prev.gold - item.cost }));
    setGoldSpentTotal((prev) => prev + item.cost);
    setShopOwned((prev) => ({ ...prev, [slot]: [...prev[slot], item.id] }));
    pushLog([`[System]: Purchased ${item.label} — ${item.cost} Gold.`]);
  }

  function equipCosmeticItem(slot, itemId) {
    if (itemId !== null && !shopOwned[slot].includes(itemId)) return;
    setShopEquipped((prev) => ({ ...prev, [slot]: itemId }));
  }

  function buyAccessoryTier() {
    const nextIdx = accessoryTier; // tier N is index N-1; buying rung `accessoryTier + 1`
    if (nextIdx >= ACCESSORY_TIERS.length) return;
    const tier = ACCESSORY_TIERS[nextIdx];
    if (inventory.gold < tier.cost) return;
    setInventory((prev) => ({ ...prev, gold: prev.gold - tier.cost }));
    setGoldSpentTotal((prev) => prev + tier.cost);
    setAccessoryTier(nextIdx + 1);
    pushLog([`[System]: Purchased ${tier.label} — ${tier.cost} Gold.`]);
  }

  function buyAuraTier() {
    const nextIdx = auraTier;
    if (nextIdx >= AURA_TIERS.length) return;
    const tier = AURA_TIERS[nextIdx];
    if (inventory.gold < tier.cost) return;
    setInventory((prev) => ({ ...prev, gold: prev.gold - tier.cost }));
    setGoldSpentTotal((prev) => prev + tier.cost);
    setAuraTier(nextIdx + 1);
    pushLog([`[System]: Purchased ${tier.label} — ${tier.cost} Gold.`]);
  }

  // Opens the Daily Quest's Mystery Box. Nothing is the most likely outcome — this is meant
  // to feel like a real loot roll, not a guaranteed bonus every day.
  // Weighted loot roll: 30% Teleportation Stone, 20% Bonus Stat Point, 3% Auto Level Up
  // (extremely rare — instantly grants a level, no XP requirement), 47% nothing.
  // Weighted loot roll. Gold is the common floor — every roll gives something, nothing
  // returns empty-handed. Teleportation Stone and Auto Level Up are the two power outliers,
  // both pushed to the rarest tier since they bypass real mechanics (penalty, XP curve).
  // Small Gold 36% | Medium Gold 18% | Large Gold 6%
  // Bonus Point 10% | XP Booster 10% | HV Catalyst 15%
  // Teleport Stone 3% | Auto Level Up 2%
  // Small Gold 31% | Medium Gold 18% | Large Gold 6% | Bonus Point 10% | XP Booster 10%
  // HV Catalyst 15% | Hairstyle Change 5% | Teleport Stone 3% | Auto Level Up 2%
  // Usable, not auto-opened — this only runs when the player taps Open on a banked box.
  function openMysteryBox() {
    if (inventory.mysteryBoxes <= 0) return;
    setInventory((prev) => ({ ...prev, mysteryBoxes: prev.mysteryBoxes - 1 }));
    const roll = Math.random() * 100;
    if (roll < 31) {
      setInventory((prev) => ({ ...prev, gold: prev.gold + 10 }));
      setGoldEarnedTotal((prev) => prev + 10);
      pushLog(["[System]: Mystery Box — 10 Gold."]);
    } else if (roll < 49) {
      setInventory((prev) => ({ ...prev, gold: prev.gold + 25 }));
      setGoldEarnedTotal((prev) => prev + 25);
      pushLog(["[System]: Mystery Box — 25 Gold."]);
    } else if (roll < 55) {
      setInventory((prev) => ({ ...prev, gold: prev.gold + 60 }));
      setGoldEarnedTotal((prev) => prev + 60);
      pushLog(["[System]: Mystery Box — 60 Gold."]);
    } else if (roll < 65) {
      setInventory((prev) => ({ ...prev, bonusStatPoints: prev.bonusStatPoints + 1 }));
      pushLog(["[System]: Mystery Box — Bonus Stat Point acquired."]);
    } else if (roll < 75) {
      setInventory((prev) => ({ ...prev, xpBoosters: prev.xpBoosters + 1 }));
      pushLog(["[System]: Mystery Box — XP Booster acquired."]);
    } else if (roll < 90) {
      setInventory((prev) => ({ ...prev, hvCatalysts: prev.hvCatalysts + 1 }));
      pushLog(["[System]: Mystery Box — HV Catalyst acquired."]);
    } else if (roll < 95) {
      setInventory((prev) => ({ ...prev, hairstyleChanges: prev.hairstyleChanges + 1 }));
      pushLog(["[System]: Mystery Box — Hairstyle Change acquired."]);
    } else if (roll < 98) {
      setInventory((prev) => ({ ...prev, teleportStones: prev.teleportStones + 1 }));
      setHighTierDropCount((prev) => prev + 1);
      pushLog(["[System]: Mystery Box — ??? acquired.", "[System]: Teleportation Stone."]);
    } else {
      const newLevel = level + 1;
      setHighTierDropCount((prev) => prev + 1);
      pushLog(["[System]: Mystery Box — ??? acquired.", "[System]: Auto Level Up triggered."]);
      setLevel(newLevel);
      setPendingLevelUps((prev) => [...prev, { fromLevel: level, toLevel: newLevel }]);
    }
  }

  function useTeleportStone() {
    if (inventory.teleportStones <= 0) return;
    setInventory((prev) => ({ ...prev, teleportStones: prev.teleportStones - 1 }));
    setPenaltyActive(false);
    setActiveChallenge(null);
    setPenaltyDeadline(null);
    pushLog([
      "[System]: Teleportation Stone used.",
      "[System]: Penalty bypassed. App access restored.",
    ]);
  }

  function spendBonusStatPoint() {
    if (inventory.bonusStatPoints <= 0) return;
    const domain = DOMAINS.find((d) => d.key === spendBonusDomain);
    setInventory((prev) => ({ ...prev, bonusStatPoints: prev.bonusStatPoints - 1 }));
    setDomainStats((prev) => ({ ...prev, [spendBonusDomain]: prev[spendBonusDomain] + 1 }));
    setDomainReceivedPointSinceCycle((prev) => ({ ...prev, [spendBonusDomain]: true }));
    pushLog([`[System]: Bonus Stat Point spent — ${domain.label} +1.`]);
  }

  // Load saved state on mount. Runs once; sets `loaded` when done so the auto-save effect
  // doesn't fire on default state before a real save has had a chance to load.
  useEffect(() => {
    (async () => {
      let hadSave = false;
      try {
        const result = await window.storage.get("system-engine-save", false);
        if (result && result.value) {
          const s = JSON.parse(result.value);
          if (s.level) setLevel(s.level);
          if (s.xp !== undefined) setXp(s.xp);
          if (s.domainStats) setDomainStats(s.domainStats);
          if (s.domainHV) setDomainHV(s.domainHV);
          if (s.domainPointsMissedStreak) setDomainPointsMissedStreak(s.domainPointsMissedStreak);
          if (s.domainMainQuestsSinceReset) setDomainMainQuestsSinceReset(s.domainMainQuestsSinceReset);
          if (s.domainQuestCount) setDomainQuestCount(s.domainQuestCount);
          if (s.totalCyclesCompleted !== undefined) setTotalCyclesCompleted(s.totalCyclesCompleted);
          if (s.inventory) setInventory(s.inventory);
          if (s.xpBoostActive !== undefined) setXpBoostActive(s.xpBoostActive);
          if (s.unlockedEmblems) setUnlockedEmblems(s.unlockedEmblems);
          if (s.avatar) setAvatar(s.avatar);
          if (s.avatarLocked !== undefined) setAvatarLocked(s.avatarLocked);
          if (s.manualQuests) setManualQuests(s.manualQuests);
          if (s.mainQuests) setMainQuests(s.mainQuests);
          if (s.missCount !== undefined) setMissCount(s.missCount);
          if (s.goldEarnedTotal !== undefined) setGoldEarnedTotal(s.goldEarnedTotal);
          if (s.goldSpentTotal !== undefined) setGoldSpentTotal(s.goldSpentTotal);
          if (s.highTierDropCount !== undefined) setHighTierDropCount(s.highTierDropCount);
          if (s.activeUrgentQuests) setActiveUrgentQuests(s.activeUrgentQuests);
          if (s.shopOwned) setShopOwned(s.shopOwned);
          if (s.shopEquipped) setShopEquipped(s.shopEquipped);
          if (s.accessoryTier !== undefined) setAccessoryTier(s.accessoryTier);
          if (s.auraTier !== undefined) setAuraTier(s.auraTier);
          // Real-clock daily cycle state — now persisted so it survives a reload within
          // the same real day, and so a missed midnight can be caught up on next open.
          if (s.checked) setChecked(s.checked);
          if (s.questComplete !== undefined) setQuestComplete(s.questComplete);
          if (s.dailyQuestDeadline !== undefined) setDailyQuestDeadline(s.dailyQuestDeadline);
          if (s.penaltyActive !== undefined) setPenaltyActive(s.penaltyActive);
          if (s.activeChallenge !== undefined) setActiveChallenge(s.activeChallenge);
          if (s.challengeTier !== undefined) setChallengeTier(s.challengeTier);
          if (s.penaltyDeadline !== undefined) setPenaltyDeadline(s.penaltyDeadline);
          hadSave = true;
        }
      } catch (e) {
        // no save yet — fresh start
      }
      setLoaded(true);
      pushLog(
        hadSave
          ? ["[System]: Welcome back, Player.", "[System]: Progress restored."]
          : [
              "[System]: You have become a Player.",
              "[System]: Daily Quest has arrived.",
              "[System]: Failure to comply will result in a penalty.",
            ]
      );
    })();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // Auto-saves the durable game state as one combined key whenever it changes. Daily Quest
  // and Penalty state (checked, questComplete, dailyQuestDeadline, penaltyActive, etc.) are
  // now included too — the real-clock model needs them persisted so a reload mid-day
  // resumes correctly, and so a missed midnight gets caught up on next open instead of
  // silently vanishing (see the deadline-crossing effect above).
  useEffect(() => {
    if (!loaded) return;
    const state = {
      level,
      xp,
      domainStats,
      domainHV,
      domainPointsMissedStreak,
      domainMainQuestsSinceReset,
      domainQuestCount,
      totalCyclesCompleted,
      inventory,
      xpBoostActive,
      unlockedEmblems,
      avatar,
      avatarLocked,
      manualQuests,
      mainQuests,
      missCount,
      goldEarnedTotal,
      goldSpentTotal,
      highTierDropCount,
      activeUrgentQuests,
      shopOwned,
      shopEquipped,
      accessoryTier,
      auraTier,
      checked,
      questComplete,
      dailyQuestDeadline,
      penaltyActive,
      activeChallenge,
      challengeTier,
      penaltyDeadline,
    };
    window.storage.set("system-engine-save", JSON.stringify(state), false).catch(() => {});
  }, [
    loaded,
    level,
    xp,
    domainStats,
    domainHV,
    domainPointsMissedStreak,
    domainMainQuestsSinceReset,
    domainQuestCount,
    totalCyclesCompleted,
    inventory,
    xpBoostActive,
    unlockedEmblems,
    avatar,
    avatarLocked,
    manualQuests,
    mainQuests,
    missCount,
    goldEarnedTotal,
    goldSpentTotal,
    highTierDropCount,
    activeUrgentQuests,
    shopOwned,
    shopEquipped,
    accessoryTier,
    auraTier,
    checked,
    questComplete,
    dailyQuestDeadline,
    penaltyActive,
    activeChallenge,
    challengeTier,
    penaltyDeadline,
  ]);

  // Wipes both the save and all in-memory state back to defaults.
  async function debugReset() {
    try {
      await window.storage.delete("system-engine-save", false);
    } catch (e) {
      // nothing saved yet — fine
    }
    setLevel(1);
    setXp(0);
    setDomainStats(Object.fromEntries(DOMAINS.map((d) => [d.key, 0])));
    setDomainHV(Object.fromEntries(DOMAINS.map((d) => [d.key, 0])));
    setDomainPointsMissedStreak(Object.fromEntries(DOMAINS.map((d) => [d.key, 0])));
    setDomainReceivedPointSinceCycle(Object.fromEntries(DOMAINS.map((d) => [d.key, false])));
    setDomainMainQuestsSinceReset(Object.fromEntries(DOMAINS.map((d) => [d.key, 0])));
    setTotalCyclesCompleted(0);
    setDomainQuestCount(Object.fromEntries(DOMAINS.map((d) => [d.key, 0])));
    setInventory({
      mysteryBoxes: 0,
      teleportStones: 0,
      bonusStatPoints: 0,
      xpBoosters: 0,
      hvCatalysts: 0,
      hairstyleChanges: 0,
      gold: 0,
    });
    setXpBoostActive(false);
    setUnlockedEmblems({});
    setLevelUpNotification(null);
    setPendingLevelUps([]);
    setAvatar({
      gender: GENDERS[0],
      skinTone: SKIN_TONES[1],
      eyeColor: EYE_COLORS[0],
      hairColor: HAIR_COLORS[0],
      hairstyle: HAIRSTYLES[2],
    });
    setAvatarLocked(false);
    setHairstyleEditUnlocked(false);
    setManualQuests([]);
    setMainQuests(Object.fromEntries(DOMAINS.map((d) => [d.key, { label: "", complete: false }])));
    setMissCount(0);
    setGoldEarnedTotal(0);
    setGoldSpentTotal(0);
    setHighTierDropCount(0);
    setActiveUrgentQuests([]);
    setUrgentTimeLeft(0);
    setUrgentPopupView("quest");
    setUrgentQuestsThisCycle(0);
    setShopOwned({ head: [], upper: [], lower: [] });
    setShopEquipped({ head: null, upper: null, lower: null });
    setAccessoryTier(0);
    setAuraTier(0);
    setChecked({});
    setQuestComplete(false);
    setDailyQuestDeadline(null); // init effect will set a fresh next-midnight value
    setPenaltyActive(false);
    setActiveChallenge(null);
    setChallengeTier(1);
    setPenaltyDeadline(null);
    setResetArmed(false);
    setSimResults(null);
    setDebugTriggerResult(null);
    clearLog();
    pushLog(["[System]: Debug reset — all progress wiped."]);
  }

  // Single shared clock heartbeat — every countdown display and deadline check derives
  // from this instead of running its own independent decrementing timer.
  useEffect(() => {
    const t = setInterval(() => setNowTick(Date.now()), 1000);
    return () => clearInterval(t);
  }, []);

  // Initializes dailyQuestDeadline to the next real midnight the first time it's needed —
  // either a brand-new save, or a debug reset that cleared it back to null.
  useEffect(() => {
    if (loaded && dailyQuestDeadline === null) {
      setDailyQuestDeadline(getNextMidnight(Date.now()));
    }
  }, [loaded, dailyQuestDeadline]);

  // Fires whenever real midnight has passed relative to the current cycle's deadline —
  // whether that's because the app was open and a tick just crossed it live, or because
  // the app was closed over midnight and this is the first render after reopening (same
  // logic handles both: nowTick starts near "now" on mount, so if the loaded deadline is
  // already in the past, this fires immediately rather than waiting for a fresh tick).
  // Guarded on penaltyActive so it doesn't double-fire while already locked — see
  // clearPenalty/useTeleportStone for what happens if ANOTHER day passes while still stuck.
  useEffect(() => {
    if (!loaded || penaltyActive || dailyQuestDeadline === null) return;
    if (nowTick < dailyQuestDeadline) return;

    if (questComplete) {
      // Completed before the deadline hit — roll cleanly into the next cycle.
      setChecked({});
      setQuestComplete(false);
      setDailyQuestDeadline(getNextMidnight(nowTick));
    } else {
      // Deadline passed with the quest incomplete — apply the penalty retroactively,
      // exactly as if the countdown had hit zero while the app was open.
      triggerPenalty();
      setDailyQuestDeadline(getNextMidnight(nowTick));
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [nowTick, loaded, dailyQuestDeadline, questComplete, penaltyActive]);

  // Drains the pending level-up queue one at a time. This is what actually calls
  // processLevelUp — deferred to an effect (never called synchronously from grantXp) so it
  // always reads state AFTER every other setState from the triggering action has committed,
  // instead of stale pre-action closures.
  useEffect(() => {
    if (pendingLevelUps.length === 0) return;
    const [next, ...rest] = pendingLevelUps;
    setPendingLevelUps(rest);
    processLevelUp(next.fromLevel, next.toLevel);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [pendingLevelUps]);

  // The first active Urgent Quest is the "focused" one — the modal only ever shows one at
  // a time, even if multiple domains have quests queued simultaneously.
  const focusedUrgentQuest = activeUrgentQuests[0] || null;
  const focusedUrgentQuestIdRef = useRef(null);

  // Single consolidated effect for both "a new quest just became focused, reset the timer"
  // and "count down the existing timer." These MUST live in one effect, not two — splitting
  // them caused a real race: the countdown-check effect would read the leftover urgentTimeLeft
  // from whatever the PREVIOUS quest left it at (often 0, right after a resolve/fail) in the
  // same pass as the reset effect, immediately failing a quest that had just been created,
  // before the reset to 45s had actually applied. The ref lets this effect tell "brand new
  // quest, just reset and stop here" apart from "same quest, keep counting down."
  useEffect(() => {
    if (!focusedUrgentQuest) {
      focusedUrgentQuestIdRef.current = null;
      return;
    }

    if (focusedUrgentQuestIdRef.current !== focusedUrgentQuest.id) {
      focusedUrgentQuestIdRef.current = focusedUrgentQuest.id;
      setUrgentTimeLeft(URGENT_QUEST_WINDOW_SECONDS);
      setUrgentPopupView("quest");
      return; // don't evaluate failure this same pass — nothing to fail yet
    }

    if (urgentTimeLeft <= 0) {
      failFocusedUrgentQuest();
      return;
    }
    const t = setTimeout(() => setUrgentTimeLeft((s) => s - 1), 1000);
    return () => clearTimeout(t);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [urgentTimeLeft, focusedUrgentQuest]);

  // Timeout with no reward. Deliberately doesn't reset the domain's neglect/stagnation
  // clocks or add any extra punishment — the underlying signal that caused it stays exactly
  // where it was, so it can simply resurface and roll again later.
  function failFocusedUrgentQuest() {
    if (!focusedUrgentQuest) return;
    const quest = focusedUrgentQuest;
    setActiveUrgentQuests((prev) => prev.filter((q) => q.id !== quest.id));
    pushLog([`[System]: Urgent Quest failed — ${quest.label}`, "[System]: No reward granted."]);
  }

  function touchedMapFromChecked() {
    const map = {};
    DOMAINS.forEach((d) => {
      const task = DAILY_TASKS.find((t) => t.domain === d.key);
      map[d.key] = !!(task && checked[task.id]);
    });
    return map;
  }

  // Runs at the end of every cycle (success or failure). Grows HV for whatever got touched
  // (daily tasks = 2 HV each), rolls the neglect clock, tracks stat-allocation stagnation,
  // and evaluates Urgent Quest triggers — only on a full pass does it also rank HV to
  // allocate the 3 earned stat points across domains.
  function endCycle({ awardPoints }) {
    const touched = touchedMapFromChecked();

    // Daily task HV growth now routes through grantHV, so it also counts toward leveling
    // (1 HV = 1 XP), consistent with every other HV source.
    DOMAINS.forEach((d) => {
      if (touched[d.key]) grantHV(d.key, 2);
    });

    setDomainQuestCount((prev) => {
      const next = { ...prev };
      DOMAINS.forEach((d) => {
        if (touched[d.key]) next[d.key] = (next[d.key] || 0) + 1;
      });
      return next;
    });

    // Ranked HV allocation replaced with 1 manually-allocated point per Daily Quest pass —
    // banked in inventory, spent on whichever domain the player chooses via the existing
    // Bonus Stat Point flow.
    if (awardPoints) {
      setInventory((prev) => ({ ...prev, bonusStatPoints: prev.bonusStatPoints + 1 }));
      pushLog(["[System]: +1 Stat Point earned. Allocate it in Inventory."]);
    }

    // The daily cycle's only remaining job for the Urgent Quest system: refresh the
    // per-cycle fire cap. Neglect and stagnation are both level-up-driven now — this
    // cycle boundary doesn't touch either of them.
    setUrgentQuestsThisCycle(0);
    setTotalCyclesCompleted((n) => n + 1); // real endCycle() count, for comparing against Level

    setChecked({});
  }

  // Neglect: consecutive level-up checkpoints without receiving a stat point (the old
  // domainPointsMissedStreak/domainReceivedPointSinceCycle tracking — repurposed as
  // neglect's definition now, not a separately-named "stagnation").
  function severityFromNeglect(streak) {
    if (streak >= NEGLECT_THRESHOLDS.severe) return "severe";
    if (streak >= NEGLECT_THRESHOLDS.moderate) return "moderate";
    if (streak >= NEGLECT_THRESHOLDS.mild) return "mild";
    return null;
  }

  // Stagnation: how far this domain's Main Quest completions have fallen behind whichever
  // domain has completed the most, within the current window (since the last stagnation
  // reset). counts must include every domain, including this one.
  function severityFromStagnation(domainKey, counts) {
    const maxCount = Math.max(0, ...Object.values(counts));
    const deficit = maxCount - (counts[domainKey] || 0);
    if (deficit >= MAIN_QUEST_IMBALANCE_THRESHOLDS.severe) return "severe";
    if (deficit >= MAIN_QUEST_IMBALANCE_THRESHOLDS.moderate) return "moderate";
    if (deficit >= MAIN_QUEST_IMBALANCE_THRESHOLDS.mild) return "mild";
    return null;
  }

  // Caps at 1 new Urgent Quest per cycle, gated on chance rather than firing automatically
  // the instant a domain crosses threshold. Two independent trigger sources feed the same
  // pool: neglect (not touched) and stagnation (touched, but keeps losing the point ranking).
  // Whichever is worse for a domain determines its severity. Eligible domains that don't get
  // picked stay queued silently for future cycles — no notification for a non-event.
  // Pure readout of what's currently eligible, straight from real committed game state —
  // used for the debug panel's live preview and the "run trigger on current state" button.
  // NOT used by evaluateUrgentTriggers itself: that function is called from processLevelUp
  // with a freshly-computed neglect map that hasn't been committed to state yet, so it needs
  // its own pass rather than reading domainPointsMissedStreak directly.
  function getCurrentEligibleDomains() {
    return DOMAINS.map((d) => {
      if (activeUrgentQuests.some((q) => q.domain === d.key)) return null;
      const neglectSev = severityFromNeglect(domainPointsMissedStreak[d.key] || 0);
      const stagnationSev = severityFromStagnation(d.key, domainMainQuestsSinceReset);
      let severity = null;
      let reason = null;
      if (neglectSev && SEVERITY_RANK[neglectSev] >= (SEVERITY_RANK[stagnationSev] || 0)) {
        severity = neglectSev;
        reason = "neglect";
      } else if (stagnationSev) {
        severity = stagnationSev;
        reason = "stagnation";
      }
      return severity ? { domain: d, severity, reason } : null;
    }).filter(Boolean);
  }

  // Pure roll: given a list of {domain, severity} eligible entries, returns the picked
  // one or null. No side effects — this is the exact mechanism both the real trigger path
  // and the debug simulator use, so simulating it actually tests the real code.
  function rollUrgentTrigger(eligible) {
    if (eligible.length === 0) return null;
    if (Math.random() > URGENT_TRIGGER_CHANCE) return null;
    const totalWeight = eligible.reduce((sum, e) => sum + SEVERITY_WEIGHT[e.severity], 0);
    let roll = Math.random() * totalWeight;
    let picked = eligible[0];
    for (const e of eligible) {
      roll -= SEVERITY_WEIGHT[e.severity];
      if (roll <= 0) {
        picked = e;
        break;
      }
    }
    return picked;
  }

  // Debug: fires rollUrgentTrigger 1000x against a synthetic eligible set (not real game
  // state) and tallies results. Tests the actual chance-gate + severity-weighting mechanism
  // in isolation, since waiting on real cycles to see if the odds "feel right" is slow and
  // easy to misjudge from a handful of pulls.
  function runUrgentTriggerSimulation(scenarioLabel, eligible) {
    const iterations = 1000;
    let firedCount = 0;
    const pickCounts = {};
    for (let i = 0; i < iterations; i++) {
      const picked = rollUrgentTrigger(eligible);
      if (picked) {
        firedCount++;
        pickCounts[picked.domain.key] = (pickCounts[picked.domain.key] || 0) + 1;
      }
    }
    setSimResults({ scenarioLabel, iterations, firedCount, pickCounts, eligible });
  }

  function evaluateUrgentTriggers(pointsMissedMap, mainQuestCounts) {
    if (urgentQuestsThisCycle >= URGENT_QUESTS_PER_CYCLE_CAP) return; // cap reached for this cycle
    setActiveUrgentQuests((prevActive) => {
      const eligible = DOMAINS.map((d) => {
        if (prevActive.some((q) => q.domain === d.key)) return null; // already has one active
        const neglectSev = severityFromNeglect(pointsMissedMap[d.key] || 0);
        const stagnationSev = severityFromStagnation(d.key, mainQuestCounts);
        let severity = null;
        let reason = null;
        if (neglectSev && SEVERITY_RANK[neglectSev] >= (SEVERITY_RANK[stagnationSev] || 0)) {
          severity = neglectSev;
          reason = "neglect";
        } else if (stagnationSev) {
          severity = stagnationSev;
          reason = "stagnation";
        }
        return severity ? { domain: d, severity, reason } : null;
      }).filter(Boolean);

      const picked = rollUrgentTrigger(eligible);
      if (!picked) return prevActive;

      const pool = URGENT_POOL[picked.domain.key].filter((q) => q.severity === picked.severity);
      if (pool.length === 0) return prevActive;
      const chosen = pool[Math.floor(Math.random() * pool.length)];
      const newQuest = {
        id: `${picked.domain.key}-${Date.now()}-${Math.random()}`,
        domain: picked.domain.key,
        label: chosen.label,
        severity: picked.severity,
      };

      // Player-facing log stays mechanics-free — no "neglect"/"stagnation" reveal, same
      // spirit as HV being a hidden value. The severity badge on the quest card itself
      // (mild/moderate/severe) is the only difficulty signal the player sees.
      pushLog([
        `[System]: Urgent Quest — ${picked.domain.label}.`,
        `[System]: ${chosen.label}`,
      ]);
      setUrgentQuestsThisCycle((n) => n + 1);

      // Stagnation reset rule: firing a quest FOR stagnation wipes the imbalance window for
      // EVERY domain, not just the picked one — the slate clears once you've been prompted
      // to address it, rather than immediately flagging whichever domain is next-most-behind.
      if (picked.reason === "stagnation") {
        setDomainMainQuestsSinceReset(Object.fromEntries(DOMAINS.map((dm) => [dm.key, 0])));
      }

      return [...prevActive, newQuest];
    });
  }

  // Debug-only wrapper: runs the real trigger logic (same pure helpers, same real
  // consequences — a fired result really does add a real Urgent Quest and log it) but also
  // captures the outcome synchronously for display, since evaluateUrgentTriggers itself is
  // silent on a non-fire by design, which makes it look like nothing happened when testing.
  function runTriggerOnCurrentState() {
    const eligible = getCurrentEligibleDomains();
    const picked = rollUrgentTrigger(eligible);

    if (!picked) {
      setDebugTriggerResult({
        eligible,
        fired: false,
        reason: eligible.length === 0 ? "No domain eligible." : "Roll failed (40% chance not met).",
      });
      return;
    }

    const pool = URGENT_POOL[picked.domain.key].filter((q) => q.severity === picked.severity);
    if (pool.length === 0) {
      setDebugTriggerResult({ eligible, fired: false, reason: "Picked domain had an empty pool." });
      return;
    }
    const chosen = pool[Math.floor(Math.random() * pool.length)];
    const newQuest = {
      id: `${picked.domain.key}-${Date.now()}-${Math.random()}`,
      domain: picked.domain.key,
      label: chosen.label,
      severity: picked.severity,
    };
    setActiveUrgentQuests((prev) => [...prev, newQuest]);
    // Shares the exact same player-facing (mechanics-hidden) log text as the real trigger
    // path — this button applies real consequences, so the log it produces should read
    // identically to what a real level-up trigger would write. Full detail (reason,
    // severity) still shows in debugTriggerResult below, in the Debug tab only.
    pushLog([
      `[System]: Urgent Quest — ${picked.domain.label}.`,
      `[System]: ${chosen.label}`,
    ]);
    if (picked.reason === "stagnation") {
      setDomainMainQuestsSinceReset(Object.fromEntries(DOMAINS.map((dm) => [dm.key, 0])));
    }
    setDebugTriggerResult({ eligible, fired: true, picked, questLabel: chosen.label });
  }

  function resolveUrgentQuest(quest) {
    setActiveUrgentQuests((prev) => prev.filter((q) => q.id !== quest.id));
    setDomainQuestCount((prev) => ({ ...prev, [quest.domain]: (prev[quest.domain] || 0) + 1 }));
    setDomainStats((prev) => ({ ...prev, [quest.domain]: prev[quest.domain] + 1 }));
    setDomainReceivedPointSinceCycle((prev) => ({ ...prev, [quest.domain]: true })); // auto stat point
    grantXp(15);
    grantHV(quest.domain, 1); // +1 more XP on top of the 15, since HV now always carries XP
    pushLog([
      `[System]: Urgent Quest resolved — ${quest.label}`,
      "[System]: +15 XP, +1 stat point.",
    ]);
  }

  // Manual quests: player-authored, ad hoc ("go to the gym today"). Gives XP and HV, but no
  // direct stat bump — same as Main Quests, HV only influences future daily point allocation.
  // Completing one still counts as touching that domain today.
  function addManualQuest() {
    const label = newManualLabel.trim();
    if (!label) return;
    setManualQuests((prev) => [
      ...prev,
      { id: `manual-${Date.now()}-${Math.random()}`, label, domain: newManualDomain },
    ]);
    setNewManualLabel("");
  }

  function completeManualQuest(quest) {
    setManualQuests((prev) => prev.filter((q) => q.id !== quest.id));
    setDomainQuestCount((prev) => ({ ...prev, [quest.domain]: (prev[quest.domain] || 0) + 1 }));
    grantXp(10);
    grantHV(quest.domain, 1); // +1 more XP on top of the 10
    pushLog([`[System]: Manual Quest complete — ${quest.label}`, "[System]: +10 XP, +1 HV."]);
  }

  // Main quests: one per domain, mandatory-feeling milestone objective, player-authored.
  // +3 HV plus a bigger XP reward on completion, matching the weight of a real milestone.
  function updateMainQuestLabel(domainKey, text) {
    setMainQuests((prev) => ({ ...prev, [domainKey]: { ...prev[domainKey], label: text } }));
  }

  function completeMainQuest(domainKey) {
    const quest = mainQuests[domainKey];
    if (!quest.label.trim() || quest.complete) return;
    setMainQuests((prev) => ({ ...prev, [domainKey]: { ...prev[domainKey], complete: true } }));
    setDomainQuestCount((prev) => ({ ...prev, [domainKey]: (prev[domainKey] || 0) + 1 }));
    setDomainMainQuestsSinceReset((prev) => ({ ...prev, [domainKey]: (prev[domainKey] || 0) + 1 }));
    grantXp(60);
    grantHV(domainKey, 3); // +3 more XP on top of the 60
    pushLog([
      `[System]: Main Quest complete — ${quest.label}`,
      "[System]: +60 XP, +3 HV.",
    ]);
  }

  function resetMainQuest(domainKey) {
    setMainQuests((prev) => ({ ...prev, [domainKey]: { label: "", complete: false } }));
  }

  function setAvatarField(field, value) {
    setAvatar((prev) => ({ ...prev, [field]: value }));
    if (field === "hairstyle" && hairstyleEditUnlocked) {
      setHairstyleEditUnlocked(false);
      pushLog([`[System]: Hairstyle updated — ${value}.`]);
    }
  }

  function confirmAvatar() {
    setAvatarLocked(true);
    pushLog(["[System]: Avatar locked in.", "[System]: Use a Hairstyle Change to alter it later."]);
  }

  // Renders the hair silhouette on top of the base head shape. Kept as simple stacked
  // ellipses/rects rather than precise anatomical paths — this is a stylized placeholder,
  // not final art, since there's no way to visually preview SVG alignment from code alone.
  // Splits the body silhouette into upper (chest/shoulders) and lower (waist down) regions
  // so Shop's Upper/Lower slots can recolor them independently. Per-gender coordinates are
  // hand-picked to roughly match the original single-piece torso shape, split at the waist.
  function getAvatarBodyPaths(gender) {
    if (gender === "Female") {
      return {
        upper: "M 72 165 L 128 165 L 125 195 L 75 195 Z",
        lower: "M 75 195 L 125 195 L 122 225 L 78 225 Z",
      };
    }
    if (gender === "Non-binary") {
      return {
        upper: "M 67 165 L 133 165 L 129 195 L 71 195 Z",
        lower: "M 71 195 L 129 195 L 125 225 L 75 225 Z",
      };
    }
    return {
      upper: "M 62 165 L 138 165 L 133 195 L 67 195 Z",
      lower: "M 67 195 L 133 195 L 128 225 L 72 225 Z",
    };
  }

  function renderAvatarHair(hairstyle, hairColor) {
    if (hairstyle === "Bald") return null;
    const cap =
      hairstyle === "Buzzcut" ? (
        <ellipse cx="100" cy="72" rx="42" ry="16" fill={hairColor} />
      ) : (
        <ellipse cx="100" cy="70" rx="42" ry="24" fill={hairColor} />
      );
    if (hairstyle === "Buzzcut") return cap;
    if (hairstyle === "Short") {
      return (
        <>
          {cap}
          <rect x="58" y="70" width="10" height="20" rx="4" fill={hairColor} />
          <rect x="132" y="70" width="10" height="20" rx="4" fill={hairColor} />
        </>
      );
    }
    if (hairstyle === "Medium") {
      return (
        <>
          {cap}
          <rect x="58" y="70" width="10" height="40" rx="4" fill={hairColor} />
          <rect x="132" y="70" width="10" height="40" rx="4" fill={hairColor} />
        </>
      );
    }
    if (hairstyle === "Long") {
      return (
        <>
          {cap}
          <rect x="56" y="70" width="12" height="90" rx="5" fill={hairColor} />
          <rect x="132" y="70" width="12" height="90" rx="5" fill={hairColor} />
        </>
      );
    }
    if (hairstyle === "Ponytail") {
      return (
        <>
          {cap}
          <rect x="58" y="70" width="10" height="20" rx="4" fill={hairColor} />
          <rect x="132" y="70" width="10" height="20" rx="4" fill={hairColor} />
          <path d="M 136 75 Q 170 100 150 170 Q 165 110 130 80 Z" fill={hairColor} />
        </>
      );
    }
    return cap;
  }

  function triggerPenalty() {
    endCycle({ awardPoints: false }); // cycle ends in failure — HV/neglect still update, no points awarded

    const nextMissCount = missCount + 1;
    const tier = nextMissCount >= ESCALATION_THRESHOLD ? 2 : 1;
    const challenge = PENALTY_POOL[Math.floor(Math.random() * PENALTY_POOL.length)];
    const duration = Math.round(
      challenge.baseSeconds * (tier === 2 ? ESCALATION_MULTIPLIER : 1)
    );

    setMissCount(nextMissCount);
    setActiveChallenge(challenge);
    setChallengeTier(tier);
    setPenaltyDeadline(Date.now() + duration * 1000);
    setPenaltyActive(true);

    pushLog([
      "[System]: Daily Quest failed.",
      `[System]: App locked. Penalty assigned: ${challenge.label}.`,
      tier === 2
        ? `[System]: Escalation Tier 2 — ${nextMissCount} consecutive misses.`
        : "[System]: Complete the challenge to restore access.",
    ]);
  }

  function clearPenalty() {
    if (!canClearPenalty) return;
    pushLog([
      "[System]: Challenge verified complete.",
      "[System]: App access restored.",
      "[System]: Daily Quest reset.",
    ]);
    setPenaltyActive(false);
    setActiveChallenge(null);
    setPenaltyDeadline(null);
  }

  function toggleTask(task) {
    if (questComplete || penaltyActive) return;
    setChecked((prev) => ({ ...prev, [task.id]: !prev[task.id] }));
  }

  useEffect(() => {
    const allDone = DAILY_TASKS.every((t) => checked[t.id]);
    if (allDone && !questComplete) {
      completeQuest();
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [checked]);

  function completeQuest() {
    setQuestComplete(true);
    const gainedXp = 40;

    pushLog(["[System]: Daily Quest complete.", `[System]: +${gainedXp} XP.`, "[System]: +1 Mystery Box."]);
    grantXp(gainedXp);
    setMissCount(0);
    endCycle({ awardPoints: true }); // full pass — HV grows for all 6, +1 manual stat point banked
    setInventory((prev) => ({ ...prev, mysteryBoxes: prev.mysteryBoxes + 1 }));
  }

  const combinedLog = logHistory;
  const questProgress = DAILY_TASKS.filter((t) => checked[t.id]).length;

  // Derived, never independently stored — always exactly correct relative to real time,
  // since they're computed fresh from timestamps rather than decremented by a timer.
  const dailyTimeLeft =
    dailyQuestDeadline !== null ? Math.max(0, Math.round((dailyQuestDeadline - nowTick) / 1000)) : 0;
  const penaltyTimeLeftDerived =
    penaltyDeadline !== null ? Math.max(0, Math.round((penaltyDeadline - nowTick) / 1000)) : 0;
  const canClearPenalty = penaltyDeadline !== null && nowTick >= penaltyDeadline;

  if (!loaded) {
    return (
      <div
        className="w-full min-h-[600px] font-sans p-4 sm:p-6 rounded-lg flex items-center justify-center"
        style={{ backgroundColor: "#0B0D12", color: "#D6DCE5" }}
      >
        <style>{`.mono { font-family: "JetBrains Mono", ui-monospace, monospace; }`}</style>
        <div className="mono text-xs" style={{ color: "#8B94A3" }}>
          [System]: Loading save data...
        </div>
      </div>
    );
  }

  // Full app lockout — this replaces the entire interface, no nav, no bypass,
  // until the assigned challenge's minimum duration has elapsed and it's marked complete.
  if (penaltyActive) {
    const domainMeta = activeChallenge && DOMAINS.find((d) => d.key === activeChallenge.domain);
    return (
      <div
        className="w-full min-h-[600px] font-sans p-4 sm:p-6 rounded-lg flex flex-col items-center justify-center text-center relative"
        style={{ backgroundColor: "#0B0D12", color: "#D6DCE5" }}
      >
        <style>{`.mono { font-family: "JetBrains Mono", ui-monospace, monospace; }`}</style>

        <button
          onClick={() => setShowDebug((s) => !s)}
          className="mono text-[9px] px-2 py-1 rounded transition absolute top-4 right-4"
          style={{ border: "1px solid #1E2430", color: "#5A6272" }}
        >
          DEBUG
        </button>
        {showDebug && (
          <div
            className="absolute top-12 right-4 rounded-md px-3 py-2 z-10"
            style={{ border: "1px solid #2A2010", backgroundColor: "#161206" }}
          >
            {!resetArmed ? (
              <button
                onClick={() => setResetArmed(true)}
                className="mono text-[10px] px-3 py-1.5 rounded transition whitespace-nowrap"
                style={{ border: "1px solid #E5484D", color: "#E5484D" }}
              >
                RESET ALL PROGRESS
              </button>
            ) : (
              <div className="flex flex-col gap-1.5">
                <span className="mono text-[9px] whitespace-nowrap" style={{ color: "#E5484D" }}>
                  Wipes save + all state. Confirm?
                </span>
                <div className="flex gap-1.5">
                  <button
                    onClick={debugReset}
                    className="mono text-[10px] px-2 py-1 rounded"
                    style={{ border: "1px solid #E5484D", backgroundColor: "#E5484D", color: "#0B0D12" }}
                  >
                    YES
                  </button>
                  <button
                    onClick={() => setResetArmed(false)}
                    className="mono text-[10px] px-2 py-1 rounded"
                    style={{ border: "1px solid #2A3140", color: "#D6DCE5" }}
                  >
                    CANCEL
                  </button>
                </div>
              </div>
            )}
          </div>
        )}

        <ShieldAlert size={36} color="#E5484D" />
        <div className="mono text-[#E5484D] text-sm tracking-widest mt-4">
          APP LOCKED{challengeTier === 2 ? " — ESCALATION TIER 2" : ""}
        </div>
        <div className="mono text-[10px] text-[#8B94A3] mt-1">
          {missCount} consecutive miss{missCount !== 1 ? "es" : ""}
        </div>

        <div className="mt-6 border border-[#2A1518] bg-[#160D0F] rounded-md px-6 py-5 max-w-sm w-full">
          <div className="flex items-center justify-center gap-2 mb-2">
            <Lock size={14} color={domainMeta?.color || "#E5484D"} />
            <span
              className="mono text-[10px] tracking-widest"
              style={{ color: domainMeta?.color || "#E5484D" }}
            >
              {domainMeta?.label}
            </span>
          </div>
          <div className="text-[#EDEFF3] text-sm">{activeChallenge?.label}</div>
        </div>

        <div className="mt-6 mono text-xs text-[#8B94A3]">
          {canClearPenalty
            ? "Minimum duration met."
            : `Locked for ${formatCountdown(penaltyTimeLeftDerived)} minimum`}
        </div>
        {!canClearPenalty && (
          <div className="w-full max-w-xs h-1.5 bg-[#1E2430] rounded-full overflow-hidden mt-3">
            <div
              className="h-full bg-[#E5484D] transition-all duration-1000"
              style={{
                width: `${
                  activeChallenge
                    ? ((Math.round(
                        activeChallenge.baseSeconds *
                          (challengeTier === 2 ? ESCALATION_MULTIPLIER : 1)
                      ) -
                        penaltyTimeLeftDerived) /
                        Math.round(
                          activeChallenge.baseSeconds *
                            (challengeTier === 2 ? ESCALATION_MULTIPLIER : 1)
                        )) *
                      100
                    : 0
                }%`,
              }}
            />
          </div>
        )}

        <button
          onClick={clearPenalty}
          disabled={!canClearPenalty}
          className="mono text-xs mt-6 px-5 py-2.5 rounded border border-[#2A3140] bg-[#12151C] text-[#D6DCE5] disabled:opacity-40 disabled:cursor-not-allowed hover:border-[#3DDBD9] transition"
        >
          MARK CHALLENGE COMPLETE
        </button>

        {inventory.teleportStones > 0 && (
          <button
            onClick={useTeleportStone}
            className="mono text-xs mt-3 px-5 py-2.5 rounded border border-[#3DDBD9] bg-[#0F1218] text-[#3DDBD9] hover:bg-[#12151C] transition"
          >
            USE TELEPORTATION STONE ({inventory.teleportStones}) — SKIP PENALTY
          </button>
        )}

        <div className="mono text-[9px] text-[#5A6272] mt-3 max-w-xs">
          Prototype note: self-reported. Real build needs an honest completion
          signal — a linked workout log, timer app, or similar — or this button
          defeats the whole mechanic.
        </div>
      </div>
    );
  }

  return (
    <div
      className="w-full min-h-[600px] font-sans p-4 sm:p-6 rounded-lg"
      style={{ backgroundColor: "#0B0D12", color: "#D6DCE5" }}
    >
      <style>{`
        .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
      `}</style>

      {/* Level Up popup — overlays the current view, dismissible, doesn't lock anything */}
      {levelUpNotification && (
        <div
          className="fixed inset-0 flex items-center justify-center z-50 p-4"
          style={{ backgroundColor: "rgba(0,0,0,0.7)" }}
        >
          <div
            className="rounded-md px-6 py-5 max-w-xs w-full text-center"
            style={{ border: "1px solid #3DDBD9", backgroundColor: "#12151C" }}
          >
            <Zap size={28} color="#3DDBD9" className="mx-auto mb-2" />
            <div className="mono text-xs tracking-widest mb-3" style={{ color: "#3DDBD9" }}>
              LEVEL UP
            </div>
            <div className="mono text-lg mb-4" style={{ color: "#EDEFF3" }}>
              Level: {levelUpNotification.fromLevel} → {levelUpNotification.toLevel}
            </div>
            <div className="space-y-1 mb-5">
              {DOMAINS.filter((d) => levelUpNotification.gains[d.key]).map((d) => (
                <div key={d.key} className="flex items-center justify-between mono text-xs">
                  <span style={{ color: d.color }}>{d.label}</span>
                  <span style={{ color: "#D6DCE5" }}>
                    {levelUpNotification.gains[d.key].before} → {levelUpNotification.gains[d.key].after}
                  </span>
                </div>
              ))}
              {Object.keys(levelUpNotification.gains).length === 0 && (
                <div className="mono text-xs" style={{ color: "#5A6272" }}>
                  No eligible domain for stat gain.
                </div>
              )}
            </div>
            <button
              onClick={() => setLevelUpNotification(null)}
              className="mono text-xs px-5 py-2 rounded transition"
              style={{ border: "1px solid #3DDBD9", color: "#3DDBD9" }}
            >
              CONTINUE
            </button>
          </div>
        </div>
      )}

      {/* Urgent Quest semi-lock — a modal overlay, not a full app-replace like the Penalty
          Zone. Everything else stays visible underneath but non-interactive. Only the
          focused quest and Inventory (toggled via urgentPopupView) are reachable. Persists
          until the quest completes, fails (timer runs out), or a debug reset clears it. */}
      {focusedUrgentQuest && (() => {
        const domain = DOMAINS.find((d) => d.key === focusedUrgentQuest.domain);
        const severityColor =
          focusedUrgentQuest.severity === "severe"
            ? "#E5484D"
            : focusedUrgentQuest.severity === "moderate"
            ? "#F2A93B"
            : "#D6DCE5";
        return (
          <div
            className="fixed inset-0 flex items-center justify-center z-40 p-4"
            style={{ backgroundColor: "rgba(0,0,0,0.8)" }}
          >
            <div
              className="rounded-md px-6 py-5 max-w-sm w-full relative"
              style={{ border: "1px solid #F2A93B", backgroundColor: "#12151C" }}
            >
              <button
                onClick={() => setShowDebug((s) => !s)}
                className="mono text-[9px] px-2 py-1 rounded transition absolute top-4 right-4"
                style={{ border: "1px solid #1E2430", color: "#5A6272" }}
              >
                DEBUG
              </button>
              {showDebug && (
                <div
                  className="absolute top-12 right-4 rounded-md px-3 py-2 z-10"
                  style={{ border: "1px solid #2A2010", backgroundColor: "#161206" }}
                >
                  {!resetArmed ? (
                    <button
                      onClick={() => setResetArmed(true)}
                      className="mono text-[10px] px-3 py-1.5 rounded transition whitespace-nowrap"
                      style={{ border: "1px solid #E5484D", color: "#E5484D" }}
                    >
                      RESET ALL PROGRESS
                    </button>
                  ) : (
                    <div className="flex flex-col gap-1.5">
                      <span className="mono text-[9px] whitespace-nowrap" style={{ color: "#E5484D" }}>
                        Wipes save + all state. Confirm?
                      </span>
                      <div className="flex gap-1.5">
                        <button
                          onClick={debugReset}
                          className="mono text-[10px] px-2 py-1 rounded"
                          style={{
                            border: "1px solid #E5484D",
                            backgroundColor: "#E5484D",
                            color: "#0B0D12",
                          }}
                        >
                          YES
                        </button>
                        <button
                          onClick={() => setResetArmed(false)}
                          className="mono text-[10px] px-2 py-1 rounded"
                          style={{ border: "1px solid #2A3140", color: "#D6DCE5" }}
                        >
                          CANCEL
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              )}

              {urgentPopupView === "quest" ? (
                <>
                  <div className="flex items-center gap-2 mb-3">
                    <ShieldAlert size={20} color="#F2A93B" />
                    <span className="mono text-xs tracking-widest" style={{ color: "#F2A93B" }}>
                      URGENT QUEST{activeUrgentQuests.length > 1 ? ` (1 of ${activeUrgentQuests.length})` : ""}
                    </span>
                  </div>

                  <div className="flex items-center gap-2 mb-2">
                    <span
                      className="mono text-[9px] tracking-widest px-1.5 py-0.5 rounded"
                      style={{ color: severityColor, border: `1px solid ${severityColor}` }}
                    >
                      {focusedUrgentQuest.severity.toUpperCase()}
                    </span>
                    <span className="mono text-[10px] tracking-wide" style={{ color: domain.color }}>
                      {domain.label}
                    </span>
                  </div>

                  <div className="text-sm mb-4" style={{ color: "#EDEFF3" }}>
                    {focusedUrgentQuest.label}
                  </div>

                  <div className="mono text-xs mb-4" style={{ color: "#F2A93B" }}>
                    {formatCountdown(urgentTimeLeft)} remaining
                  </div>

                  <div className="flex gap-2 flex-wrap">
                    <button
                      onClick={() => resolveUrgentQuest(focusedUrgentQuest)}
                      className="mono text-xs px-4 py-2 rounded transition"
                      style={{ border: "1px solid #3DDBD9", color: "#3DDBD9" }}
                    >
                      RESOLVE
                    </button>
                    <button
                      onClick={() => setUrgentPopupView("inventory")}
                      className="mono text-xs px-4 py-2 rounded transition"
                      style={{ border: "1px solid #2A3140", color: "#D6DCE5" }}
                    >
                      INVENTORY
                    </button>
                  </div>
                </>
              ) : (
                <>
                  <div className="flex items-center justify-between mb-3">
                    <span className="mono text-xs tracking-widest" style={{ color: "#8B94A3" }}>
                      INVENTORY
                    </span>
                    <button
                      onClick={() => setUrgentPopupView("quest")}
                      className="mono text-[10px] px-3 py-1.5 rounded transition"
                      style={{ border: "1px solid #2A3140", color: "#D6DCE5" }}
                    >
                      BACK
                    </button>
                  </div>
                  {renderInventoryPanel()}
                  {inventory.mysteryBoxes === 0 &&
                    inventory.teleportStones === 0 &&
                    inventory.bonusStatPoints === 0 &&
                    inventory.xpBoosters === 0 &&
                    inventory.hvCatalysts === 0 &&
                    inventory.gold === 0 && (
                      <div className="mono text-[10px]" style={{ color: "#5A6272" }}>
                        Inventory is empty.
                      </div>
                    )}
                </>
              )}
            </div>
          </div>
        );
      })()}

      {/* Status bar */}
      <div className="flex items-center justify-between border border-[#1E2430] bg-[#12151C] rounded-md px-4 py-3 mb-4">
        <div className="flex items-center gap-3">
          <Zap size={18} color="#3DDBD9" />
          <div>
            <div className="mono text-xs text-[#8B94A3] tracking-widest">PLAYER</div>
            <div className="mono text-sm text-[#EDEFF3]">Don · Level {level}</div>
          </div>
        </div>
        <div className="flex-1 mx-6 hidden sm:block">
          <div className="mono text-[10px] text-[#8B94A3] mb-1">
            XP {xp} / {xpToNext}
          </div>
          <div className="h-1.5 bg-[#1E2430] rounded-full overflow-hidden">
            <div
              className="h-full bg-[#3DDBD9] transition-all duration-500"
              style={{ width: `${Math.min(100, (xp / xpToNext) * 100)}%` }}
            />
          </div>
        </div>
      </div>

      {/* Tab navigation */}
      <div className="flex gap-1 mb-4 border border-[#1E2430] bg-[#12151C] rounded-md p-1">
        {[
          { key: "character", label: "CHARACTER" },
          { key: "quests", label: "QUESTS" },
          { key: "shop", label: "SHOP" },
          { key: "debug", label: "DEBUG" },
        ].map((t) => (
          <button
            key={t.key}
            onClick={() => setActiveTab(t.key)}
            className={`flex-1 mono text-[10px] tracking-widest px-2 py-2 rounded transition ${
              activeTab === t.key
                ? "bg-[#0F1218] text-[#3DDBD9] border border-[#3DDBD9]"
                : "text-[#8B94A3] border border-transparent hover:text-[#D6DCE5]"
            }`}
          >
            {t.label}
          </button>
        ))}
      </div>

      {activeTab === "character" && (
        <>
      {/* System Log — moved here since it carries info from every part of the app
          (quests, mystery box, emblems, level-ups, shop purchases), not just quests. */}
      <div className="border border-[#1E2430] bg-[#12151C] rounded-md p-4 mb-4">
        <div className="mono text-xs tracking-widest text-[#8B94A3] mb-3">SYSTEM LOG</div>
        <div className="space-y-1.5 overflow-y-auto max-h-64">
          {combinedLog.map((line, i) => (
            <div key={i} className="mono text-xs text-[#7EE8E6] leading-relaxed">
              {line}
            </div>
          ))}
        </div>
      </div>

      {/* Avatar — base identity, separate from Shop cosmetics which layer on top later.
          One-and-done: locks after confirmation. Only a Hairstyle Change item reopens

            <button
              onClick={runTriggerOnCurrentState}
              className="mono text-[10px] px-3 py-1.5 rounded border border-[#2A3140] hover:border-[#3DDBD9] transition text-[#D6DCE5]"
            >
              RUN TRIGGER NOW
            </button>
            {debugTriggerResult && (
              <div
                className="mono text-[9px] mt-2 px-2 py-1.5 rounded border"
                style={{
                  borderColor: debugTriggerResult.fired ? "#3DDBD9" : "#2A3140",
                  color: debugTriggerResult.fired ? "#3DDBD9" : "#8B94A3",
                }}
              >
                {debugTriggerResult.fired
                  ? `FIRED — ${debugTriggerResult.picked.domain.label} (${debugTriggerResult.picked.severity}): ${debugTriggerResult.questLabel}`
                  : `NO FIRE — ${debugTriggerResult.reason}`}
              </div>
            )}
            <div className="mono text-[9px] text-[#5A6272] mt-1">
              Real state, real consequences if it fires — but this button intentionally
              bypasses the per-cycle cap above, since it's a testing tool, not a real
              level-up event.
            </div>
          </div>

          {/* Urgent Quest trigger simulator — tests the chance-gate + severity-weighted
              pick against synthetic scenarios, not real game state. */}
          <div className="mt-3 pt-3 border-t border-[#2A2010]">
            <div className="mono text-[10px] text-[#8B94A3] mb-2">
              URGENT TRIGGER SIMULATOR (1000 rolls per scenario)
            </div>
            <div className="flex gap-2 flex-wrap mb-2">
              <button
                onClick={() => runUrgentTriggerSimulation("0 eligible domains", [])}
                className="mono text-[9px] px-2 py-1.5 rounded border border-[#2A3140] hover:border-[#3DDBD9] transition text-[#D6DCE5]"
              >
                0 Eligible
              </button>
              <button
                onClick={() =>
                  runUrgentTriggerSimulation("1 eligible (severe)", [
                    { domain: DOMAINS[0], severity: "severe" },
                  ])
                }
                className="mono text-[9px] px-2 py-1.5 rounded border border-[#2A3140] hover:border-[#3DDBD9] transition text-[#D6DCE5]"
              >
                1 Eligible (Severe)
              </button>
              <button
                onClick={() =>
                  runUrgentTriggerSimulation("3 eligible (mixed severity)", [
                    { domain: DOMAINS[0], severity: "severe" },
                    { domain: DOMAINS[1], severity: "moderate" },
                    { domain: DOMAINS[2], severity: "mild" },
                  ])
                }
                className="mono text-[9px] px-2 py-1.5 rounded border border-[#2A3140] hover:border-[#3DDBD9] transition text-[#D6DCE5]"
              >
                3 Eligible (Mixed)
              </button>
              <button
                onClick={() =>
                  runUrgentTriggerSimulation(
                    "6 eligible (all severe)",
                    DOMAINS.map((d) => ({ domain: d, severity: "severe" }))
                  )
                }
                className="mono text-[9px] px-2 py-1.5 rounded border border-[#2A3140] hover:border-[#3DDBD9] transition text-[#D6DCE5]"
              >
                6 Eligible (All Severe)
              </button>
            </div>

            {simResults && (
              <div className="mono text-[10px] text-[#D6DCE5] bg-[#0F1218] border border-[#1E2430] rounded px-3 py-2 space-y-1">
                <div className="text-[#8B94A3]">{simResults.scenarioLabel}</div>
                <div>
                  Fired: {simResults.firedCount}/{simResults.iterations} (
                  {((simResults.firedCount / simResults.iterations) * 100).toFixed(1)}% — target ~
                  {(URGENT_TRIGGER_CHANCE * 100).toFixed(0)}%)
                </div>
                {simResults.eligible.length > 0 && simResults.firedCount > 0 && (
                  <div className="pt-1 space-y-0.5">
                    {simResults.eligible.map((e) => {
                      const count = simResults.pickCounts[e.domain.key] || 0;
                      const totalWeight = simResults.eligible.reduce(
                        (sum, x) => sum + SEVERITY_WEIGHT[x.severity],
                        0
                      );
                      const expectedPct = ((SEVERITY_WEIGHT[e.severity] / totalWeight) * 100).toFixed(1);
                      const actualPct = ((count / simResults.firedCount) * 100).toFixed(1);
                      return (
                        <div key={e.domain.key} className="flex justify-between">
                          <span style={{ color: e.domain.color }}>
                            {e.domain.label} ({e.severity})
                          </span>
                          <span className="text-[#5A6272]">
                            {count} picks — {actualPct}% actual / {expectedPct}% expected
                          </span>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}
          </div>
        </div>
      )}

    </div>
  );
}

try {
  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<SystemEngine />);
} catch (err) {
  const diag = document.getElementById("diag");
  diag.style.display = "block";
  diag.textContent += "[render error] " + (err && err.message ? err.message : err) + "\n" + (err && err.stack ? err.stack : "") + "\n\n";
}
</script>
</body>
</html>
