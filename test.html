<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Diagnostic Test</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
<div id="root"></div>
<div id="diag" style="display:none; position:fixed; inset:0; background:#000; color:#ff6b6b; font-family:monospace; font-size:16px; padding:20px; white-space:pre-wrap; z-index:9999;"></div>
<script>
  window.addEventListener("error", function (e) {
    const diag = document.getElementById("diag");
    diag.style.display = "block";
    diag.textContent += "[error] " + (e.message || e) + "\n";
  });
</script>
<script type="text/babel" data-presets="react">
  const { useState } = React;
  function TestApp() {
    const [count, setCount] = useState(0);
    return (
      <div className="p-8 bg-[#12151C] text-white min-h-screen">
        <h1 className="text-2xl mb-4">Diagnostic test — if you see this, CDN scripts work fine.</h1>
        <button
          className="px-4 py-2 bg-blue-600 rounded"
          onClick={() => setCount(count + 1)}
        >
          Clicked {count} times
        </button>
      </div>
    );
  }
  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<TestApp />);
</script>
</body>
</html>
